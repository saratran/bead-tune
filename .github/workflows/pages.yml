# Publishes the static app (bun run build → dist/) to GitHub Pages.
#
# To use it: Settings → Pages → Source: "GitHub Actions" (a private repo needs a paid
# GitHub plan for Pages). It runs when started by hand (Actions → Deploy to GitHub Pages
# → Run workflow); add `push: { branches: [main] }` under `on:` to deploy on every push.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
